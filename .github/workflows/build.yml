name: Build The Parallel Mod

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Extract project
        run: unzip TheParallel_Simple_Build_Test.zip -d project

      - name: Build mod
        run: |
          cd project/TheParallel_Simple
          gradle build

      - uses: actions/upload-artifact@v4
        with:
          name: TheParallel-Mod
          path: project/TheParallel_Simple/build/libs/*.jar
