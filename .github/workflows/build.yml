name: Build The Parallel Mod

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Extract ZIP
        run: |
          mkdir project
          unzip TheParallel_Project_Upload.zip -d project

      - name: Build
        run: |
          cd project
          gradle build

      - uses: actions/upload-artifact@v4
        with:
          name: TheParallel-Mod
          path: project/build/libs/*.jar
